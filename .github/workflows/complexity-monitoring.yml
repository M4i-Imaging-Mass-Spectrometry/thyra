name: Complexity Monitoring

on:
  push:
    branches: [ main, develop ]
  # Deliberately unfiltered, as in tests.yml: `branches:` here would match the
  # PR's BASE branch, which silently excludes stacked PRs. The `push:` filter
  # above is left narrow on purpose -- this should not start running on every
  # push to every feature branch, only on the PRs those branches open.
  pull_request:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

# Add explicit permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  complexity-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        # The monitor's --files-changed mode diffs this checkout against the
        # PR's base branch, so that ref has to be here. The default
        # fetch-depth: 1 leaves a shallow clone that has no base branch at all,
        # which is what made fast mode dead on every PR: the diff exited 128
        # and the script quietly scanned the whole repository instead.
        # `git fetch --depth=1 origin $GITHUB_BASE_REF` would be cheaper, but a
        # three-dot diff needs a common ancestor and two depth-1 tips have none.
        # The cost is small enough not to be worth that risk: a full clone of
        # this repo packs to 26 MiB against 12 MiB shallow.
        fetch-depth: 0

    # No dependency install. complexity_monitor.py imports only the standard
    # library (argparse/ast/json/subprocess/...), so the full Poetry venv this
    # job used to build and cache was never needed to run it.
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Run complexity monitoring
      run: |
        echo "Starting complexity monitoring..."
        echo "Current directory: $(pwd)"
        echo "Python version: $(python --version)"
        echo "Event: ${{ github.event_name }}"

        echo "Running complexity monitor..."
        set +e  # Don't exit on error so we can capture the exit code

        # Use different modes based on event type
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "PR detected: Analyzing changed files only (fast mode)"
          python .github/scripts/complexity_monitor.py \
            --threshold 15 \
            --files-changed \
            --save
        else
          echo "Main branch or scheduled run: Full analysis"
          python .github/scripts/complexity_monitor.py \
            --threshold 15 \
            --save
        fi

        COMPLEXITY_EXIT_CODE=$?
        echo "Complexity monitor exit code: $COMPLEXITY_EXIT_CODE"

        if [ $COMPLEXITY_EXIT_CODE -eq 0 ]; then
          echo "SUCCESS: No complexity violations found"
        elif [ $COMPLEXITY_EXIT_CODE -eq 2 ]; then
          echo "BROKEN: The monitor could not work out which files changed (see the error above)."
          echo "BROKEN: This is a CI configuration problem, not a complexity violation."
        else
          echo "FAILURE: Complexity violations found (exit code: $COMPLEXITY_EXIT_CODE)"
        fi

        # Always exit 0 here since we use continue-on-error
        exit $COMPLEXITY_EXIT_CODE
      continue-on-error: true
      id: complexity-check

    - name: Upload complexity reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: complexity-reports
        path: reports/complexity/
        retention-days: 30

    - name: Comment on PR with complexity results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v9
      continue-on-error: true
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = require('path');

          // Find the latest complexity report
          const reportsDir = 'reports/complexity/';
          if (!fs.existsSync(reportsDir)) {
            console.log('No complexity reports found');
            return;
          }

          const files = fs.readdirSync(reportsDir)
            .filter(f => f.startsWith('complexity_report_'))
            .sort()
            .reverse();

          if (files.length === 0) {
            console.log('No complexity report files found');
            return;
          }

          const latestReport = JSON.parse(
            fs.readFileSync(path.join(reportsDir, files[0]), 'utf8')
          );

          // The report carries the threshold it was actually generated with;
          // reading it back beats a literal that silently goes stale the first
          // time the --threshold argument above changes.
          const threshold = latestReport.threshold ?? 'N/A';

          let comment = '## Complexity Monitoring Report\n\n';
          comment += `**Threshold:** ${threshold}\n`;
          comment += `**Total Violations:** ${latestReport.total_violations}\n`;

          if (latestReport.total_violations > 0) {
            comment += `**Average Complexity:** ${latestReport.average_complexity}\n`;
            comment += `**Maximum Complexity:** ${latestReport.max_complexity}\n\n`;

            comment += '### Complexity Distribution\n';
            for (const [category, count] of Object.entries(latestReport.complexity_distribution)) {
              comment += `- ${category}: ${count}\n`;
            }

            comment += '\n### Top Complex Functions\n';
            const topFunctions = latestReport.high_complexity_functions.slice(0, 5);
            for (let i = 0; i < topFunctions.length; i++) {
              const func = topFunctions[i];
              comment += `${i + 1}. \`${func.file}:${func.line}\` - ${func.function} (${func.complexity})\n`;
            }

            comment += `\n> **Warning:** Consider refactoring functions with complexity > ${threshold} for better maintainability.`;
          } else {
            comment += '\n**Excellent!** No complexity violations found.';
          }

          try {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            console.log('SUCCESS: Successfully posted complexity report comment');
          } catch (error) {
            console.log('WARNING: Failed to post PR comment (permissions issue):', error.message);
            console.log('INFO: Complexity report is still available in workflow artifacts');
          }

    - name: Output complexity report to workflow log
      if: always()
      run: |
        echo "COMPLEXITY MONITORING SUMMARY"
        echo "================================="
        if [ -d "reports/complexity" ] && [ "$(ls -A reports/complexity)" ]; then
          echo "Latest complexity report:"
          ls -la reports/complexity/ | head -5
          if [ -f reports/complexity/*.json ]; then
            latest_report=$(ls -t reports/complexity/*.json | head -1)
            echo "Report contents:"
            cat "$latest_report"
          fi
        else
          echo "No complexity reports generated (likely no violations found)"
        fi

        echo ""
        echo "DIRECT COMPLEXITY CHECK (for debugging):"
        echo "================================="
        # No --quiet: that flag prints the violations and nothing else, so on a
        # repository with none -- the steady state, and the state today -- this
        # banner would introduce an empty stretch of log. What is wanted here is
        # the whole-repo summary, which is also the part `--files-changed` runs
        # above deliberately do not compute.
        python .github/scripts/complexity_monitor.py --threshold 15 --no-save || true

    - name: Set complexity check status
      run: |
        if [ "${{ steps.complexity-check.outcome }}" = "failure" ]; then
          echo "FAILED: Complexity check failed - violations found"
          exit 1
        else
          echo "PASSED: Complexity check passed"
        fi
