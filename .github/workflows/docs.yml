name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "thyra/**"
      # docs/changelog.md is a snippets include of this file, so a release that
      # only rewrites the changelog still changes a published page.
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install mkdocs-material "mkdocstrings[python]" mkdocs-jupyter

      - name: Install thyra (for API docs)
        run: pip install -e .

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
