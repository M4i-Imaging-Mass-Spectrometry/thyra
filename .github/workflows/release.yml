name: Publish to PyPI

# Build and publish one tagged version (D49).
#
# This workflow cuts nothing. The version, the tag and the GitHub Release come
# from merging the release pull request (release-please.yml), and that
# workflow dispatches this one at the new tag. It runs only on a dispatch,
# because a tag created with GITHUB_TOKEN starts no workflow on its own.
#
# To publish a tag again by hand (for example after a PyPI outage):
#
#   gh workflow run release.yml --ref v4.5.0
#
# PyPI refuses a second upload of a file it already holds, and `skip-existing`
# turns that into a green step, so a repeat run is harmless.
#
# The file name is load-bearing: PyPI's Trusted Publishing entry names
# `release.yml`. Renaming the file breaks publishing until PyPI is updated too.
on:
  workflow_dispatch:

# One run per tag. Two dispatches of the same tag queue rather than race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to read this commit's workflow runs. Declaring `permissions` at
      # all makes every unlisted scope `none`.
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # A dispatch can be aimed at any ref. Only a version tag is a release:
      # dispatching at a branch must publish nothing.
      - name: Refuse anything but a version tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release.yml publishes a version tag (vX.Y.Z); this run is on $REF_TYPE '$REF_NAME'."
            exit 1
          fi
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # release-please tags the commit that bumped the version, so a mismatch
      # means a tag was pushed by hand at the wrong commit. Publishing it would
      # put a tree on PyPI under a version it does not claim.
      - name: Tag matches pyproject.toml
        env:
          EXPECTED: ${{ steps.tag.outputs.version }}
        run: |
          ACTUAL=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag v$EXPECTED points at a commit whose pyproject.toml says $ACTUAL."
            exit 1
          fi
          echo "OK: v$EXPECTED matches pyproject.toml."

      # Nothing reaches PyPI from a commit the suite has not passed on. v3.0.0
      # once shipped from a commit no test job had seen.
      #
      # The gate is on the workflow named `Tests` specifically, not on "every
      # check for this commit". Waiting on every check would let an advisory
      # workflow (complexity monitoring) veto a release. `Tests` includes lint,
      # so lint can veto one (D19). Naming the workflow also means this can
      # never wait on itself.
      #
      # Where that run comes from: a release pull request merged by a person is
      # a push to main, which starts Tests on the merge commit -- the tagged
      # commit. One merged by the Monday cron is made with GITHUB_TOKEN and
      # starts nothing, so release-please.yml dispatches Tests at the tag.
      #
      # The wait is long because the run usually starts with this one: Tests
      # takes 25 to 40 minutes. Fail closed on every branch. A refused publish
      # is not a lost one: re-dispatch at the same tag once Tests is green.
      - name: Wait for Tests to pass on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          GATE_WORKFLOW="Tests"
          echo "Gate: waiting for '$GATE_WORKFLOW' on $SHA"
          STATUS=absent
          CONCLUSION=none
          for attempt in $(seq 1 180); do
            RUN=$(gh api \
                    "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
                  | jq --arg wf "$GATE_WORKFLOW" \
                      '[.workflow_runs[] | select(.name == $wf)]
                       | sort_by(.created_at) | last')
            STATUS=$(echo "$RUN" | jq -r '.status // "absent"')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // "none"')
            echo "  attempt $attempt: $GATE_WORKFLOW is $STATUS/$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then break; fi
            sleep 30
          done

          if [ "$STATUS" != "completed" ]; then
            echo "REFUSING TO PUBLISH: '$GATE_WORKFLOW' is '$STATUS' for $SHA after 90 minutes."
            echo "If it never ran at all, nothing started Tests on this commit."
            echo "Start it with: gh workflow run tests.yml --ref $GITHUB_REF_NAME"
            echo "then re-dispatch this workflow at the same tag."
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "REFUSING TO PUBLISH: '$GATE_WORKFLOW' concluded '$CONCLUSION' for $SHA."
            exit 1
          fi
          echo "Gate: '$GATE_WORKFLOW' passed."

  # Build where a compromise buys nothing. This is the split PyPA documents:
  # the job holding the Trusted Publishing identity does nothing but move a
  # file it did not make.
  #
  # No `permissions:` block, so every scope is the workflow default and none of
  # it is id-token. That is the point: `pip install build` and hatchling's
  # isolated build env both resolve unpinned dependency trees at run time, and
  # neither can be reached from a job that holds an OIDC credential.
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      # github.ref is the tag, which is what the gate checked.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [gate, build]
    # The only scope this job gets, and the only privileged thing in it.
    permissions:
      id-token: write  # Required for Trusted Publishing

    steps:
      # Take the dist that was already built. This job does not build, does not
      # check out, and does not install anything.
      - name: Download the built distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Assert that the right artifact ARRIVED, before the upload. PyPI refuses
      # a second upload of a filename it already holds, and `skip-existing`
      # below turns that refusal into a green step -- so a wrong tree published
      # under a right version number cannot be corrected by re-running this
      # workflow. The version has to be burned and a new one cut.
      #
      # hatchling names the sdist thyra-<version>.tar.gz (PEP 625) and the
      # wheel thyra-<version>-<tags>.whl (PEP 427), both from project.version.
      # The wheel tag is globbed rather than pinned to py3-none-any, so this
      # check is not what breaks if the package ever stops being pure Python.
      - name: Verify the artifact carries the tagged version
        env:
          EXPECTED: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          echo "Expecting version $EXPECTED. Downloaded:"
          ls -1 dist/
          MISSING=0
          [ -f "dist/thyra-$EXPECTED.tar.gz" ] || MISSING=1
          compgen -G "dist/thyra-$EXPECTED-*.whl" >/dev/null || MISSING=1
          if [ "$MISSING" = "1" ]; then
            echo "REFUSING TO PUBLISH: the artifact does not carry version $EXPECTED."
            exit 1
          fi
          echo "Artifact carries the tagged version $EXPECTED."

      # SHA-pinned, which is a deliberate deviation from PyPA's own README.
      # `@release/v1` moves on purpose so publishing keeps working when PyPI
      # changes its API. What tips it the other way is that this action is the
      # ONLY third-party code in the job holding the Trusted Publishing
      # identity. The pin does not bump itself (there is no dependabot config):
      # move it deliberately, and re-read PyPA's changelog when you do.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
        # No token needed - uses Trusted Publishing!

  # Rebuild the docs site after a release. A release pull request merged by a
  # person changes CHANGELOG.md on main, which starts docs.yml by itself; one
  # merged by the Monday cron is a GITHUB_TOKEN push and starts nothing. So
  # dispatch it always (workflow_dispatch is exempt from that rule). A second
  # docs run queues behind the first in docs.yml's `pages-deploy` group, so the
  # duplicate on the manual path is harmless.
  #
  # This deliberately does not depend on `publish`. A PyPI failure has no
  # bearing on whether the changelog page is correct.
  deploy-docs:
    name: Trigger Docs Deploy
    runs-on: ubuntu-latest
    needs: [gate]
    permissions:
      actions: write

    steps:
      # No checkout: `gh workflow run` needs the repo name, not its contents.
      - name: Dispatch docs.yml
        run: |
          gh workflow run docs.yml --ref main -R "$GITHUB_REPOSITORY"
          echo "Dispatched docs.yml for v${{ needs.gate.outputs.version }}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
