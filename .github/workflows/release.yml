# .github/workflows/release.yml

name: Create Release & Publish to PyPI

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Skip semantic-release and publish current version'
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Skip this job if triggered by release event or manual publish
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Release
        id: release
        run: |
          # `--print` reports the version semantic-release WOULD release. When
          # nothing on main is releasable -- a ci:/chore:/docs:/test: commit --
          # it prints the CURRENT version, not an empty string. So an emptiness
          # test can never fire, and what actually stopped the no-op release was
          # the already-tagged guard below, reporting a concurrent run that
          # never happened. Compare against the last released version instead,
          # which is the thing "is there a release to cut?" really asks.
          NEXT=$(semantic-release version --print 2>/dev/null || true)
          LAST=$(semantic-release version --print-last-released 2>/dev/null || true)
          echo "next=${NEXT:-<none>} last-released=${LAST:-<none>}"

          if [ -z "$NEXT" ]; then
            echo "No release: semantic-release could not determine a version."
            echo "released=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$NEXT" = "$LAST" ]; then
            echo "No release: nothing releasable since v$LAST (no feat/fix/perf commits)."
            echo "released=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Past this point $NEXT is a genuine bump, so an existing tag really
          # does mean another run got there first.
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "No release: v$NEXT is a new version but is already tagged -- a concurrent run created it."
            echo "released=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Creating release: v${LAST:-<none>} -> v$NEXT"

          # Run semantic-release (creates commit, tag, and GitHub release)
          semantic-release version
          echo "released=true" >> $GITHUB_OUTPUT
          echo "version=$NEXT" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release]
    # Run if: semantic-release created a release, OR a release was published, OR manual dispatch
    # Use always() to allow running even when 'release' job is skipped
    if: |
      always() && (
        (github.event_name == 'push' && needs.release.outputs.released == 'true') ||
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_only == true)
      )
    permissions:
      id-token: write  # Required for Trusted Publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          fetch-depth: 0

      - name: Pull latest changes
        if: github.event_name != 'release'
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
        # No token needed - uses Trusted Publishing!
