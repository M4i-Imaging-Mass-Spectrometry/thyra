# Pre-commit hooks configuration
#
# The four hooks that rewrite bytes in place -- the three whitespace ones and
# fix-byte-order-marker -- skip the imzML and .ibd files under
# tests/data/fixtures/, which are byte-exact fixtures rather than source.
# mixed-line-ending --fix=lf strips the 174 CRLFs that iontof_sparse.imzML
# exists to prove a real IONTOF export carries -- measured, 11,593 bytes become
# 11,419 -- and trailing-whitespace and end-of-file-fixer are equally free to
# move bytes the .ibd offsets are not expected to track. Without the exclude a
# hook run rewrites the fixture in place, and the tests then read the file the
# hook just rewrote -- measured, that costs
# TestIontofSparse::test_every_line_break_is_crlf and
# TestCommittedBytes::test_blob_is_byte_identical_to_the_worktree, which is a
# confusing failure a long way from its cause rather than a useful one.
#
# The exclude is scoped to those two extensions, so the README and the build
# script in the same directory stay covered. The .gitattributes `-text`
# exemption guards the staging side of the same hazard; this guards the
# worktree side.
repos:
  # Lab-share paths must not reach a public repo.
  #
  # Every identifying string this repo has ever leaked -- four colleagues'
  # names, a specimen filename, the share layout -- arrived as a component of
  # a path, because a path is how a note points at a dataset. So the guard is
  # on the path shape, not on a list of names: a denylist of real names would
  # have to be committed here, which republishes the very thing it removes.
  #
  # Datasets are referred to by the names in ~/.msi-datasets.toml instead.
  # That file is in the home directory, outside every repo, so it cannot be
  # committed by accident.
  #
  # A path written in prose uses single separators; a path inside source is
  # escaped and doubles them. Requiring a single separator is what tells the
  # two apart, so the fixtures in tests/unit/utils/test_windows_paths.py do
  # not trip it. The drive letter must be uppercase, which is the convention
  # in a real path and keeps the hook off Python slices such as "if a:"
  # followed by an escape.
  #
  # A UNC branch was tried and dropped: it matched every escaped newline in
  # the notebooks and caught nothing real, and no leak here arrived by UNC.
  #
  # docs/getting-started.md and docs/troubleshooting.md are exempt because
  # Windows paths are part of their subject: the first shows how to type
  # one, the second how Windows limits them. Their paths are generic
  # placeholders.
  - repo: local
    hooks:
      - id: no-lab-share-paths
        name: no lab-share paths in tracked files
        language: pygrep
        entry: '\b[A-Z]:\\(?!\\)[A-Za-z0-9_]'
        types: [text]
        exclude: ^docs/(getting-started|troubleshooting)\.md$

      # The rule above only sees BACKSLASH paths, and that is deliberate: the
      # forward-slash form is how legitimate Windows paths are written in this
      # codebase, because Path("C:/Program Files/Bruker/timsTOF/sdk") is real
      # source (readers/bruker/timstof/sdk/platform_detector.py) and so is a
      # synthetic "C:/data/run.d" in a test. Widening it to both separators
      # would fail on those.
      #
      # A user-home path is the one shape that is never legitimate in either
      # spelling -- it names a machine account, and this repository is public.
      # The rule above missed nine of them in handouts/, written with forward
      # slashes, and reported Passed while they sat in a tracked file. So this
      # is not a widening of that rule but a second, narrower one aimed at the
      # only form that carries an identity. Verified against the whole tracked
      # tree: it matches the leak and nothing else.
      - id: no-user-home-paths
        name: no user-home paths in tracked files
        language: pygrep
        entry: '[A-Za-z]:[\\/]+[Uu]sers[\\/]+'
        types: [text]
        exclude: ^docs/getting-started\.md$

  # Basic file formatting and checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/data/fixtures/([^/]+\.(imzML|ibd)|synthetic_tims\.d/.*)$
      - id: end-of-file-fixer
        exclude: ^tests/data/fixtures/([^/]+\.(imzML|ibd)|synthetic_tims\.d/.*)$
      # A UTF-8 BOM is a Windows editor default, and ast.parse rejects the
      # U+FEFF it produces. That is how a BOM on line 1 of
      # thyra/metadata/extractors/mzpeak_extractor.py exempted 14 functions
      # from the CI complexity gate for as long as it sat there, with only a
      # warning nobody read. The gate now reports such a file instead of
      # skipping it; this is the half that keeps one from arriving.
      #
      # Carries the fixture exclude for the same reason its three siblings
      # above and below do -- it is the fourth in-place byte rewriter from
      # this repo, and the header at the top of this file explains what moving
      # a fixture's bytes costs.
      - id: fix-byte-order-marker
        exclude: ^tests/data/fixtures/([^/]+\.(imzML|ibd)|synthetic_tims\.d/.*)$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # --enforce-all because the CI lane runs --all-files. Without it the
      # hook intersects its file list with `git diff --staged --diff-filter=A`,
      # and a CI checkout stages nothing, so it would report Passed having
      # weighed zero files -- a hook present in the log and absent from the
      # gate. Measured against the whole tracked tree: the only four files over
      # 1000 kB are the vendor binaries the exclude below already names, so
      # enforcing on every file rather than only on added ones is green today
      # and on a local commit still only weighs what is staged.
      - id: check-added-large-files
        args: [--maxkb=1000, --enforce-all]
        exclude: >-
          (?x)^(
            thyra/readers/bruker/timstof/sdk/dll/|
            thyra/readers/waters/lib/
          )
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/data/fixtures/([^/]+\.(imzML|ibd)|synthetic_tims\.d/.*)$

  # Python code formatting
  #
  # This `rev` must stay equal to the black uv.lock resolves, and a test
  # asserts it (tests/unit/tools/test_ci_workflows.py). They had drifted: the
  # rev was 24.4.2 while `black>=23.0.0` in the dev group locked to 26.5.1, so
  # the `uv run black .` docs/contributing.md tells a contributor to run
  # reformatted five files the hook considered already formatted. That costs
  # nothing while the hook is advisory and is a contradiction the moment CI
  # runs it: doing exactly what CONTRIBUTING says would produce a red PR.
  # Raising the rev and reformatting is what closed it -- the post-24 style
  # that hugs a parenthesised string is the whole of that diff.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Code linting with stricter rules
  # Settings live in .flake8 so this hook and `uv run flake8` cannot drift
  # apart. Do not add setting args here. The exclude below mirrors the
  # `exclude` list in .flake8, which flake8 itself ignores for filenames
  # passed explicitly the way pre-commit passes them.
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        exclude: ^(scripts/|thyra/metadata/ontology/_)

  # Type checking
  #
  # The stubs are pinned, and a test asserts that every
  # `additional_dependencies` entry in this file is. An unpinned extra is free
  # to resolve whatever is newest when a hook env happens to be built, so the
  # same commit can pass on one machine and fail on another -- tolerable while
  # the hooks were advisory, not once CI runs them. This config is unusually
  # sensitive to a stub bump besides: `warn_unused_ignores` and
  # `warn_unreachable` (pyproject.toml) let a new stub both raise a fresh error
  # and invalidate an existing `# type: ignore` in one step.
  #
  # uv.lock is the source for these two versions. Nothing keeps them in step
  # with it: there is no .github/dependabot.yml, and `pre-commit autoupdate`
  # moves `rev` only and never looks at additional_dependencies. Re-read them
  # off uv.lock by hand when this hook is next touched.
  #
  # click is deliberately absent. Adding it makes this hook report
  # `thyra/__main__.py:1181: error: Statement is unreachable`, because
  # click 8.5's `Command.main()` overload for the default
  # `standalone_mode=True` returns `NoReturn` and
  # thyra/metadata/schema/cli.py:275 types METADATA_SUBCOMMANDS as
  # `Dict[str, click.Command]`, so the `return` after the dispatch is dead to
  # mypy under `warn_unreachable`. --ignore-missing-imports makes click Any
  # instead, and the hand-rolled dispatch keeps working either way.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-requests==2.33.0.20260712
          - types-PyYAML==6.0.12.20260815
        exclude: ^(tests/|docs/)

  # Security scanning
  #
  # `bandit[toml]` is the one additional dependency here that is deliberately
  # NOT pinned, and the test that requires the others to be pinned exempts it
  # by the rule that makes it safe: the entry names this hook's OWN package, so
  # `rev` above already pins it and the extra adds nothing but the extra's
  # dependencies. Pinning it anyway is not merely redundant, it does not
  # install -- measured:
  #
  #   ERROR: Cannot install bandit 0.0.0 (from ~/.cache/pre-commit/repo.../)
  #   and bandit==1.7.9 because these package versions have conflicting
  #   dependencies.
  #
  # pre-commit builds the env with `pip install . bandit[toml]==...` from its
  # clone of this repository, and that clone's own metadata reports 0.0.0, so
  # any `==` here contradicts the very checkout it is meant to describe. The
  # version bandit scans with is the `rev`, never the dev group's bandit.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # Docstring formatting
  # Settings live in pyproject.toml, the same arrangement flake8 uses with
  # .flake8. Do not add setting args here: a YAML flow sequence splits on
  # every comma, so `args: [--convention=google, --add-ignore=D100,D104,D105]`
  # reached pydocstyle as `--add-ignore=D100` plus two stray positional
  # arguments, and D104 was reported despite appearing to be ignored.
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        exclude: ^(tests/|docs/)
