# Pre-commit hooks configuration
#
# `HAND_AUTHORED_CORPUS` below is tests/data/fixtures/, whose imzML files are
# byte-exact fixtures rather than source. The three whitespace hooks would
# each rewrite them: mixed-line-ending --fix=lf strips the 174 CRLFs that
# iontof_sparse.imzML exists to prove a real IONTOF export carries (measured:
# 11,593 bytes -> 11,419), and trailing-whitespace and end-of-file-fixer are
# free to change any byte count the .ibd offsets are not expected to track.
# None of that shows up as a test failure, because the tests read the file the
# hook just rewrote. The .gitattributes `-text` exemption covers the staging
# side of the same hazard; this covers the worktree side.
repos:
  # Basic file formatting and checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/data/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/data/fixtures/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: >-
          (?x)^(
            thyra/readers/bruker/timstof/sdk/dll/|
            thyra/readers/waters/lib/
          )
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/data/fixtures/

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Code linting with stricter rules
  # Settings live in .flake8 so this hook and `poetry run flake8` cannot drift
  # apart. Do not add setting args here. The exclude below mirrors the
  # `exclude` list in .flake8, which flake8 itself ignores for filenames
  # passed explicitly the way pre-commit passes them.
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        exclude: ^(scripts/|thyra/metadata/ontology/_)

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies: [types-requests, types-PyYAML]
        exclude: ^(tests/|docs/)

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # Docstring formatting
  # Settings live in pyproject.toml, the same arrangement flake8 uses with
  # .flake8. Do not add setting args here: a YAML flow sequence splits on
  # every comma, so `args: [--convention=google, --add-ignore=D100,D104,D105]`
  # reached pydocstyle as `--add-ignore=D100` plus two stray positional
  # arguments, and D104 was reported despite appearing to be ignored.
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        exclude: ^(tests/|docs/)
