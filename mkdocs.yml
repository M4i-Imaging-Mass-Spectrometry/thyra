site_name: Thyra
site_description: Convert imaging mass spectrometry data from Bruker, Waters, PHI and imzML into the open SpatialData format
site_url: https://M4i-Imaging-Mass-Spectrometry.github.io/thyra
repo_url: https://github.com/M4i-Imaging-Mass-Spectrometry/thyra
repo_name: M4i-Imaging-Mass-Spectrometry/thyra

theme:
  name: material
  font: false  # Use brand fonts from extra.css instead of Google Fonts
  logo: assets/thyra-logomark.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

# Snippets that pages include rather than pages of their own.
exclude_docs: |
  includes/

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false          # notebooks are committed with their outputs
      include_source: true    # offer the .ipynb for download
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # docs/changelog.md includes the repository's CHANGELOG.md rather than
  # duplicating it. base_path is resolved against the working directory mkdocs
  # is invoked from, which is the repository root for both `mkdocs build` and
  # the gh-deploy step in .github/workflows/docs.yml. check_paths turns a
  # missing or moved target into a build error rather than an empty page.
  # auto_append adds the shared abbreviations to every page, so a term such
  # as "Zarr" shows its definition on hover wherever it appears.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables

# Two layers, on purpose. "Get started" is written for someone who has never
# used a terminal: plain words, short pages, optional depth folded into
# "Advanced" boxes. "Technical reference" holds every detail for readers who
# want it. docs/contributing.md ("Writing the documentation") has the rules.
nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Your first conversion: getting-started.md
      - Tutorial: tutorial.md
      - Look at the result: explore-the-output.ipynb
      - Troubleshooting: troubleshooting.md
      - Glossary: glossary.md
  - Technical reference:
      - technical-reference.md
      - Supported formats: supported-formats.md
      - Command-line options: cli.md
      - Resampling: resampling.md
      - Output format: output-format.md
      - Coordinate systems: coordinate-systems.md
      - Metadata schema: metadata-schema.md
      - Writing the metadata document: writing-the-metadata-document.md
      - Python API: api.md
      - Design decisions: design-decisions.md
      - Format notes:
          - imzML: imzml-parser-notes.md
          - PHI ToF-SIMS: phi-tofsims-notes.md
          - Bruker solariX: solarix-notes.md
  - Project:
      - Migrating to 4.0: migration-4.0.md
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Code of conduct: code-of-conduct.md
